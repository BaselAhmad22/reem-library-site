<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>عن المكتبة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="pageLoader" class="page-loader"><div class="loader-mark">ن</div></div>
  <div id="liveBanner" class="live-banner"><span class="dot"></span><span>غير متصل</span></div>

  <header class="topbar">
    <div class="container topbar-inner">
      <a class="logo" href="index.html"><span class="logo-icon">ر</span><strong data-bind="name">مكتبة ريم</strong></a>
      <form class="header-search" id="globalSearchForm">
        <input type="search" data-i18n-placeholder="searchPlaceholder" placeholder="ابحث..." />
        <button type="submit" data-i18n="searchBtn">بحث</button>
      </form>
      <div class="topbar-actions"><button type="button" class="lang-btn" id="langBtn">EN</button></div>
    </div>
  </header>
  <nav class="subnav">
    <div class="container subnav-inner" id="subNavInner">
      <a href="index.html" data-i18n="navHome">الرئيسية</a>
      <a href="catalog.html" data-i18n="navCatalog">الكتالوج</a>
      <a class="active" href="about.html" data-i18n="navAbout">عن المكتبة</a>
      <a href="contact.html" data-i18n="navContact">تواصل</a>
    </div>
  </nav>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 data-i18n="aboutTitle">عن المكتبة</h1>
        <p data-i18n="aboutLead"></p>
      </div>
    </section>
    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="info-card">
          <h2 data-bind="name"></h2>
          <p data-bind="about"></p>
          <hr style="border:0;border-top:1px solid var(--line);margin:1.2rem 0" />
          <h3 data-i18n="visit">زورونا</h3>
          <p data-bind="address"></p>
          <p><a data-bind-href="email" data-bind="email"></a></p>
          <p data-bind="phone"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom"><span data-bind="name">مكتبة ريم</span></div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/shared.js"></script>
  <script>ElibraryApp.boot();</script>
</body>
</html>
