<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تواصل</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="pageLoader" class="page-loader"><div class="loader-mark">ن</div></div>
  <div id="liveBanner" class="live-banner"><span class="dot"></span><span>غير متصل</span></div>

  <header class="topbar">
    <div class="container topbar-inner">
      <a class="logo" href="index.html"><span class="logo-icon">ر</span><strong data-bind="name">مكتبة ريم</strong></a>
      <form class="header-search" id="globalSearchForm">
        <input type="search" data-i18n-placeholder="searchPlaceholder" placeholder="ابحث..." />
        <button type="submit" data-i18n="searchBtn">بحث</button>
      </form>
      <div class="topbar-actions"><button type="button" class="lang-btn" id="langBtn">EN</button></div>
    </div>
  </header>
  <nav class="subnav">
    <div class="container subnav-inner" id="subNavInner">
      <a href="index.html" data-i18n="navHome">الرئيسية</a>
      <a href="catalog.html" data-i18n="navCatalog">الكتالوج</a>
      <a href="about.html" data-i18n="navAbout">عن المكتبة</a>
      <a class="active" href="contact.html" data-i18n="navContact">تواصل</a>
    </div>
  </nav>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 data-i18n="contactTitle">تواصل معنا</h1>
        <p data-i18n="contactLead"></p>
      </div>
    </section>
    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="info-card contact-card">
          <p data-i18n="contactText"></p>
          <p data-bind="email"></p>
          <p data-bind="phone"></p>
          <a class="btn btn-orange" data-whatsapp href="#" target="_blank" rel="noopener">
            <span data-i18n="whatsappCta">مراسلة واتساب</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom"><span data-bind="name">مكتبة ريم</span></div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/shared.js"></script>
  <script>ElibraryApp.boot();</script>
</body>
</html>
